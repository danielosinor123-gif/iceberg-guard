[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-guard"
version = "0.1.0"
requires-python = ">=3.10"
description = "Iceberg workload reliability & layout guard: controlled baseline-vs-candidate layout evaluation"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
  "pyiceberg[sql-sqlite]>=0.12,<0.13",
  "pyarrow>=15",
  "pandas>=2",
  "numpy>=1.26",
  "duckdb>=1.0",
  "PyYAML>=6",
]

[project.scripts]
iceberg-guard = "iceberg_guard.cli:main"
pyiceberg-guard = "iceberg_guard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src_py"}

[tool.setuptools.packages.find]
where = ["src_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
