name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: install
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'
      - name: tests
        run: uv run --no-project --with pytest --python .venv/bin/python pytest -q
